services:
  insurancerp:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/insurancerp.db
      AUTH_SECRET: ${AUTH_SECRET:-harbourline-trial-change-this-secret}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
    volumes:
      - insurancerp-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  insurancerp-data:
